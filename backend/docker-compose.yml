services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuyabot-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Data lives in the volume; these are bootstrap defaults only.
      DATA_DIR: /app/data
      API_HOST: 0.0.0.0
      API_PORT: "8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backup:/app/backup
    # Host networking is required for Tuya LAN discovery (UDP broadcast).
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s
