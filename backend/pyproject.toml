[project]
name = "zen-tuyabot"
version = "0.1.0"
description = "Tuya smart-home controller: Telegram bots + REST API dashboard"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["logs", "data", "backup", ".venv", "referensi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF006", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# FastAPI dependency injection is a call in the signature by design.
"src/tuyabot/web/routes/*" = ["B008"]
"src/tuyabot/web/deps.py" = ["B008"]

[tool.ruff.lint.isort]
# Explicit on purpose. Ruff infers "first-party" from where the package
# lives, and that inference differed between the dev machine (src/ on the
# path) and CI, so the same file passed locally and failed the workflow with
# I001. Declaring it removes the guesswork.
known-first-party = ["tuyabot"]
