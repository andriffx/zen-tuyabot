# Contoh konfigurasi nginx — Zen Tuyabot

Dokumen ini **rujukan**, bukan file yang ikut dideploy. Dashboard dilayani oleh nginx
eksternal milik operator (yang sudah menangani TLS dan berperan sebagai gerbang luar).

## Blok server

```nginx
server {
    listen 443 ssl;
    http2 on;
    server_name tuya.example.com;

    ssl_certificate     /etc/ssl/certs/tuya.crt;
    ssl_certificate_key /etc/ssl/private/tuya.key;

    # Hasil `npm run build` di repo frontend (folder `build/`).
    root  /var/www/zen-tuyabot;
    index index.html;

    # ── API ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WAJIB: $http_host, bukan $host.
        # $host membuang port; backend membandingkan Origin (yang memuat port)
        # dengan Host, sehingga semua POST/PATCH/DELETE akan 403.
        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: jangan buffer, dan beri waktu baca panjang.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # ── SPA ─────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
```

## Yang harus cocok di sisi backend

| Hal | Nilai | Kenapa |
|---|---|---|
| `API_HOST` | `127.0.0.1` | API tidak boleh terekspos langsung ke LAN |
| `FORWARDED_ALLOW_IPS` | IP nginx (`127.0.0.1` bila satu mesin) | Tanpa ini audit mencatat IP proxy, dan batas login per-IP menjadi satu kuota global |
| `security.cookie_secure` | `true` saat HTTPS | Cookie `Secure` tidak dikirim lewat `http://`, sehingga login tampak gagal |

## Verifikasi setelah deploy

```bash
curl -s https://tuya.example.com/ | head -c 80
curl -s https://tuya.example.com/api/setup/status
curl -s -o /dev/null -w '%{http_code}\n' -X POST https://tuya.example.com/api/auth/login \
  -H 'Content-Type: application/json' -d '{"username":"root","password":"password-panjang"}'
```

- HTML, JSON, dan **bukan 403**.
- Lalu buka `GET /api/audit`: baris `auth.login` harus mencatat IP klien asli.
  Kalau yang tercatat IP nginx, `FORWARDED_ALLOW_IPS` belum memuat alamat proxy.
