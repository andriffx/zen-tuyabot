<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zen Tuyabot">
  <title>Zen Tuyabot</title>
  <!-- Rounded tile, works on light and dark browser chrome. -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Lightning bolt: the "switch" the app controls. -->
