# nginx inside the frontend container.
#
# The operator's own nginx (TLS, real domain) sits in front of this one and
# proxies to the published port. This server therefore listens on plain HTTP and
# must trust the upstream's forwarding headers — otherwise every mutating request
# fails the Origin check and the audit log records the proxy IP.
#
# OriginMiddleware compares the Origin header's netloc with the Host header, so
# Host must be forwarded verbatim, port included.

# Real client IPs: keep the upstream's value so the backend's rate limiting and
# audit rows are per-user, not per-proxy.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Health (used by the container HEALTHCHECK; public on purpose) ──
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # ── API ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # WAJIB: $http_host preserves the port. $host drops it, and then the
        # Origin netloc ("host:port") no longer equals Host, so every POST,
        # PATCH and DELETE is rejected with 403.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;

        # SSE (/api/stream) must not be buffered, and the read must stay open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ── SPA ──────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SvelteKit emits content-hashed files here, so they are safe to pin forever.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
